<!--
  ATTRIBUTE CONTRACT — reference only, not markup to paste.

  Build the actual structure in the Webflow Designer and add these via
  Element Settings → Custom attributes. The JS selects on data-attributes ONLY
  and never on class names, so name your classes whatever you like.

  All styling lives in Webflow (Site/Page Settings → Custom Code, or the
  Designer). This repo ships no CSS.
-->

<!-- Body → Settings → Custom attributes -->
<body data-barba="wrapper" data-page-theme="light">

  <!--
    Transition overlay. Must be a direct child of Body, OUTSIDE the container,
    or it gets swapped away mid-transition.

    What the JS assumes you have styled in Webflow:
      wrapper  — position fixed, inset 0, pointer-events none, overflow clip,
                 above page content on z-index
      columns  — laid out side by side, full width/height, offset one full
                 height ABOVE the viewport at rest (the JS animates
                 yPercent 0 → 100 → 200 from that starting point)
  -->
  <div data-transition-wrap data-theme-transition="light">
    <div><!-- column row -->
      <div data-transition-column></div>
      <div data-transition-column></div>
      <div data-transition-column></div>
      <div data-transition-column></div>
      <div data-transition-column></div>
    </div>
  </div>

  <!-- Div Block → Settings → Tag: Main, plus these attributes -->
  <main data-barba="container" data-barba-namespace="home" data-page-theme="light">

    <!-- Nav inside the container, so Webflow swaps it and w--current stays correct -->
    <nav data-theme-nav="dark">
      <a href="/">Home</a>
      <a href="/work">Work</a>

      <!-- Optional: force one link to use a specific registered transition -->
      <a href="/contact" data-transition="fade">Contact</a>
    </nav>

    <!-- page content -->

  </main>
</body>

<!--
  ATTRIBUTE REFERENCE

  data-barba="wrapper"        Body. Required by Barba.
  data-barba="container"      The per-page element Barba swaps. Required.
  data-barba-namespace        Optional. Filters PT.module({ namespace: ... }).
  data-page-theme             "light" | "dark". Drives PT.config.themes.
  data-transition             On a link or the container. Picks a registered
                              transition by name. Falls back to
                              PT.config.defaultTransition.
  data-transition-wrap        Overlay root, outside the container.
  data-transition-column      Animated columns, inside the overlay.
  data-theme-transition       Overlay element the theme is written to.
  data-theme-nav              Nav element the theme is written to.
  data-barba-update           ONLY needed if the nav sits outside the container.
                              Syncs aria-current and class from the next page.
-->
